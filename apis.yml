aid: cadence-solutions
name: Cadence Solutions
description: 'Cadence Solutions, Inc. — operating as Cadence — is a New York-based clinical
  AI and remote patient monitoring company founded in 2020 by Chris Altchek. Cadence partners
  with large health systems and payers to deliver continuous chronic-care management between
  clinic visits: FDA-cleared connected devices (blood pressure cuffs, glucometers, weight
  scales) stream daily vitals to a 24/7 clinical care team backed by supervised AI agents
  that flag out-of-range readings, close care gaps, and escalate to clinicians for medication
  titration. The platform covers hypertension, type 2 diabetes, heart failure and COPD, is
  integrated two-way into partner EHRs (Epic, Oracle Cerner, athenahealth), and supports
  Medicare RPM/CCM and the CMS ACCESS model. Cadence serves more than 100,000 patients
  across systems including Community Health Systems, LifePoint Health, Providence, Rush,
  MemorialCare, Corewell Health, Ardent Health and Duke Health. It raised a $100M Series C
  led by Spark Capital in June 2026 ($241M total, ~$1.23B valuation). Cadence publishes no
  public developer program or API: EHR interoperability is delivered as bilateral health
  system integrations, not a self-serve API surface.'
